general {
    disable_loading_bar = true
    hide_cursor = true
}

animations {
    enabled = true

    bezier = circleEase, 0.25, 1, 0.3, 1

    animation = fadeIn,          1, 5, circleEase
    animation = fadeOut,         1, 4, circleEase
    animation = inputFieldColors, 1, 5, circleEase
    animation = inputFieldFade,  1, 3, circleEase
    animation = inputFieldWidth, 1, 4, circleEase
    animation = inputFieldDots,  1, 2, circleEase
}

# BACKGROUND
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.02
    contrast = 0.8916
    brightness = 0.9
    vibrancy = 0.2
}

# CLOCK
label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 1.0)
    font_size = 80
    font_family = Sans
    position = 0, 150
    halign = center
    valign = center
}

# PASSWORD INPUT
input-field {
    size = 300, 50
    position = 0, -80
    halign = center
    valign = center
    outline_thickness = 2
    outer_color = rgba(255, 255, 255, 0.3)
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = rgba(255, 255, 255, 1.0)
    placeholder_text = Enter Password
    placeholder_text_color = rgba(255, 255, 255, 0.5)
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3
}
